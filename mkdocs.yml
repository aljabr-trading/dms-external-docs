site_name: JTC DMS Integration Docs
theme:
  name: material
  logo: assets/logo/JTCLogoWhite.png
  favicon: assets/logo/JTCLogoBlack.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search

extra_css:
  - assets/css/style.css

nav:
  - Home: index.md
  - Communication:
      - Communication List: communication/communication.md
      - Location Inquiry: communication\location-inquiry.md
  - Core:
      - Master:
        - Master List (Reference): core/master/masterlist.md
        - Master List (Lookup Types): core/master/list.md
        - Communication Messages: core/master/communication-messages.md
        - Branch List: core/master/branchlist.md
      - Customer: core/customer.md
      - Knowledge Base: core/knowledge-base.md
  - Lead:
      - Version 1:
        - Master List: lead/v1/master-list.md
        - Create Leads (Bulk): lead/v1/create-leads.md
        - Get Leads: lead/v1/get-leads.md
      - Version 2:
        - Master List: lead/v2/master-list.md
        - Create Leads (Single): lead/v2/create-leads.md
        - Duplicate Lead: lead/v2/duplicate-lead-validate.md
  - Marketing:
      - Campaign: marketing/get-campaigns.md
  - Vehicle Details:
      - Model Family: vehicle-details/model-family.md
      - Variants: vehicle-details/model-family-variants.md
      - Variant Specification: vehicle-details/by-vehicle-keys.md
  - Test Drive:
      - Bookings: testdrive/bookings.md
      - Branch List: testdrive/branch-list.md
      - Vehicle Stock List: testdrive/branch-vehicle-stock-list.md
      - Model Family List: testdrive\branch-model-family-list.md
      - Vehicle Slot List: testdrive/branch-vehicle-slot-list.md
      - Create: testdrive/create.md
      - Quick Create: testdrive/create-quick.md
      - Cancel: testdrive/cancel.md
      - Reschedule: testdrive/reschedule.md
